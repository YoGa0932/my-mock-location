name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -sL "https://github.com/gradle/gradle/raw/v8.0.2/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Generate launcher icons
        run: |
          python3 - <<'EOF'
          import struct, zlib
          def png(size, r, g, b):
              def chunk(n, d):
                  c = zlib.crc32(n+d)&0xffffffff
                  return struct.pack('>I',len(d))+n+d+struct.pack('>I',c)
              raw=b''
              for y in range(size):
                  raw+=b'\x00'+''.join(chr(r)+chr(g)+chr(b) for _ in range(size)).encode('latin1')
              return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          import os
          for d,s in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              os.makedirs(f'app/src/main/res/mipmap-{d}',exist_ok=True)
              open(f'app/src/main/res/mipmap-{d}/ic_launcher.png','wb').write(png(s,33,150,243))
          EOF
      - name: Build Release APK
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MockLocation-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30